# ─────────────────────────────────────────────────────────────────────────────
#  15-MIN BTC BOT · v3 core configuration
#
#  Every knob below is read by live code. If you add one, wire it to the
#  policy AND justify it with measured evidence from `./run.sh score` —
#  the previous config grew to ~15 interacting gates calibrated against a
#  brain that no longer existed, and most of them were silently blocking
#  the trades they were supposed to protect.
# ─────────────────────────────────────────────────────────────────────────────

kalshi:
  base_url: "https://api.elections.kalshi.com/trade-api/v2"
  ws_url: "wss://api.elections.kalshi.com/trade-api/ws/v2"
  # Credentials come from .env (KALSHI_API_KEY / KALSHI_RSA_KEY_PATH)
  series_ticker: "KXBTC15M"

feeds:
  bar_interval_sec: 60
  lookback_bars: 200
  # "brti" = consolidated median of Coinbase/Kraken/Bitstamp top-of-book,
  # MAD outlier rejection. This is what KXBTC15M actually settles against.
  price_source: "brti"

strategy:
  auto_trade: false     # false = observe and log only; no orders
  paper_trade: true     # true = simulated fills via the paper broker

# ── The decision core ────────────────────────────────────────────────────────
core:
  # 1. WINDOW — when a market is tradeable at all.
  min_seconds: 30.0
  max_seconds: 840.0

  # 2. SLICES — which (phase × price-band) buckets may fire.
  #    phase: early >9m · mid 5–9m · prime 1.5–5m · late <1.5m
  #    band:  extreme ≤15¢ or ≥85¢ · outer 15–30/70–85 · middle 30–70
  #
  #    EMPTY = every slice enabled. That is the correct R1 setting: observe
  #    everything, then restrict to what the data supports:
  #        ./run.sh score --suggest
  #    Paste the emitted list here for R2. Do not hand-pick slices.
  enabled_slices: []

  # 3. EV GATE — required expected value per contract, in cents, AFTER the
  #    Kalshi taker fee. Replaces the old flat "edge ≥ 5%". Automatically
  #    strict mid-range (fee peaks at 1.75¢) and permissive at the extremes
  #    (0.33¢), which is the structural shape of edge in this market.
  ev_margin_cents: 0.75
  min_confidence: 0.04      # |p − 0.5| × 2 — "have some directional view"
  max_spread_cents: 8.0     # wider books can't be priced honestly

  # 4. SIZING / RISK
  kelly_fraction: 0.25      # quarter-Kelly on the fee-adjusted edge
  max_single_trade_usd: 10.00
  min_single_trade_usd: 1.00
  max_per_market_usd: 10.00
  max_open_positions: 3
  daily_loss_limit_usd: 50.00

  # EXIT — one rule. Leave only if the model now wants the OTHER side by
  # this much EV and there is still time for the flip to pay. No loss cuts,
  # no profit takes: a binary settles 0/100, and the June 6 post-mortem
  # showed the loss-cut tiers realized losses on positions that went on to
  # settle as wins.
  exit_flip_min_ev_cents: 2.0
  exit_min_seconds: 120.0

  # EXECUTION
  slippage_cents: 1         # limit padding above the displayed ask

  # PAPER FIDELITY — fills always walk real displayed depth and pay real
  # fees. adverse_cents adds pessimism for the tick that moves against us
  # between decision and arrival; raise to 1.0 for a conservative estimate.
  paper_starting_cash_usd: 100.00
  paper_adverse_cents: 0.0

  # FEE MODEL — fee = ceil_to_cent(rate × multiplier × n × p × (1−p)).
  #
  # ⚠ VERIFY BEFORE LIVE TRADING. 0.07 is the documented standard-category
  #   rate. Reports of the July 2026 fee revision describe per-category
  #   multipliers and suggest CRYPTO may price above standard; Kalshi's own
  #   docs were unreachable from the build environment, so this is unverified.
  #   If the true rate is higher, every EV decision is mispriced in our favor
  #   — the worst kind of error. The engine's FeeCalibrator watches real
  #   fills and logs "[FEE] MODEL MISMATCH" with the measured value to set here.
  fee_rate: 0.07
  fee_multiplier: 1.0

  # VOL NOWCAST — blended fast/slow realized vol feeding the TWAP pricer.
  sigma_fast_sec: 60.0
  sigma_slow_sec: 300.0
  sigma_fast_weight: 0.6

logging:
  level: "INFO"
  log_file: "logs/bot.log"
  trade_log_file: "logs/trades.csv"
  max_log_size_mb: 50

# ── Telemetry recorder ───────────────────────────────────────────────────────
# Captures Kalshi WS frames, venue ticks, and one decision row per market
# per scan (with both p_model and p_market — that pairing is what makes
# `./run.sh score` possible). Never places orders.
recording:
  enabled: true
  path: "data/recordings"
  venue_coinbase: true
  venue_kraken: true
  venue_bitstamp: true
  venue_gemini: false
  grid_interval_sec: 1.0
  venue_max_msg_per_sec: 10

database:
  path: "data/btc15.db"
