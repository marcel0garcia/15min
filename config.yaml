# ─────────────────────────────────────────────────────────────────────────────
#  15-MIN BTC BOT · v3 core configuration
#
#  Every knob below is read by live code. If you add one, wire it to the
#  policy AND justify it with measured evidence from `./run.sh score` —
#  the previous config grew to ~15 interacting gates calibrated against a
#  brain that no longer existed, and most of them were silently blocking
#  the trades they were supposed to protect.
# ─────────────────────────────────────────────────────────────────────────────

kalshi:
  base_url: "https://api.elections.kalshi.com/trade-api/v2"
  ws_url: "wss://api.elections.kalshi.com/trade-api/ws/v2"
  # Credentials come from .env (KALSHI_API_KEY / KALSHI_RSA_KEY_PATH)
  series_ticker: "KXBTC15M"

feeds:
  bar_interval_sec: 60
  lookback_bars: 200
  # "brti" = consolidated median of Coinbase/Kraken/Bitstamp top-of-book,
  # MAD outlier rejection. This is what KXBTC15M actually settles against.
  price_source: "brti"

strategy:
  auto_trade: false     # false = observe and log only; no orders
  paper_trade: true     # true = simulated fills via the paper broker

# ── The decision core ────────────────────────────────────────────────────────
core:
  # 1. WINDOW — when a market is tradeable at all.
  min_seconds: 30.0
  max_seconds: 840.0

  # 2. SLICES — which (phase × price-band) buckets may fire.
  #    phase: early >9m · mid 5–9m · prime 1.5–5m · late <1.5m
  #    band:  extreme ≤15¢ or ≥85¢ · outer 15–30/70–85 · middle 30–70
  #
  #    EMPTY = every slice enabled. That is the correct R1 setting: observe
  #    everything, then restrict to what the data supports:
  #        ./run.sh score --suggest
  #    Paste the emitted list here for R2. Do not hand-pick slices.
  enabled_slices: []

  # 3. EV GATE — required expected value per contract, in cents, AFTER the
  #    Kalshi taker fee. Replaces the old flat "edge ≥ 5%". Automatically
  #    strict mid-range (fee peaks at 1.75¢) and permissive at the extremes
  #    (0.33¢), which is the structural shape of edge in this market.
  ev_margin_cents: 0.75
  min_confidence: 0.04      # |p − 0.5| × 2 — "have some directional view"
  max_spread_cents: 8.0     # wider books can't be priced honestly

  # 4. SIZING / RISK
  kelly_fraction: 0.25      # quarter-Kelly on the fee-adjusted edge
  max_single_trade_usd: 10.00
  min_single_trade_usd: 1.00
  max_per_market_usd: 10.00
  max_open_positions: 3     # inert: KXBTC15M lists ONE market at a time
  daily_loss_limit_usd: 50.00

  # ENTRY CADENCE — the only lever on trade count.
  # Verified against the live series: KXBTC15M opens exactly one market per
  # 15-minute window (open_time == the previous window's close_time), strike
  # set at-the-money at open. So the ceiling is 96 markets/day, and with
  # max_entries_per_market: 1 the bot gets exactly one shot per window.
  # Raise this to permit re-entry after an exit / scaling in as the model
  # sharpens late in the window. 1 = the original hold-to-settle behavior.
  max_entries_per_market: 1
  entry_cooldown_sec: 0.0   # wait this long after a close before re-entering

  # EXIT — one rule. Leave only if the model now wants the OTHER side by
  # this much EV and there is still time for the flip to pay. No loss cuts,
  # no profit takes: a binary settles 0/100, and the June 6 post-mortem
  # showed the loss-cut tiers realized losses on positions that went on to
  # settle as wins.
  exit_flip_min_ev_cents: 2.0
  exit_min_seconds: 120.0

  # EXECUTION
  slippage_cents: 1         # limit padding above the displayed ask

  # PAPER FIDELITY — fills always walk real displayed depth and pay real
  # fees. adverse_cents adds pessimism for the tick that moves against us
  # between decision and arrival; raise to 1.0 for a conservative estimate.
  paper_starting_cash_usd: 100.00
  paper_adverse_cents: 0.0

  # FEE MODEL — fee = ceil_to_cent(rate × multiplier × n × p × (1−p)).
  #
  # ⚠ VERIFY BEFORE LIVE TRADING. 0.07 is the documented standard-category
  #   rate. Reports of the July 2026 fee revision describe per-category
  #   multipliers and suggest CRYPTO may price above standard; Kalshi's own
  #   docs were unreachable from the build environment, so this is unverified.
  #   If the true rate is higher, every EV decision is mispriced in our favor
  #   — the worst kind of error. The engine's FeeCalibrator watches real
  #   fills and logs "[FEE] MODEL MISMATCH" with the measured value to set here.
  fee_rate: 0.07
  fee_multiplier: 1.0

  # VOL NOWCAST — blended fast/slow realized vol feeding the TWAP pricer.
  #
  # ⚠ These three were declared here from day one but never reached the
  #   engine, which called blended_sigma() with hard-coded defaults. Wired
  #   as of this change; so are the clamp bounds below, which used to live
  #   as module constants in models/vol_nowcast.py.
  sigma_fast_sec: 60.0
  sigma_slow_sec: 300.0
  sigma_fast_weight: 0.6

  # ⚠ sigma_floor IS THE MOST DANGEROUS NUMBER IN THIS FILE.
  #   It exists so one quiet minute cannot push fair value to a false
  #   coin-flip — but set too LOW it does the opposite: a floored sigma
  #   understates settlement variance, driving P(YES) toward 0/1 at exactly
  #   the extreme strikes we intend to trade. Measured on the 19AUG v3
  #   session: 27% of scans ran at this floor, and 27.5% of rows priced
  #   beyond 0.999 while the market quoted 0.99. BTC realized vol is
  #   typically 0.40-0.60 annualized. SWEEP THIS. Do not inherit the guess.
  sigma_floor: 0.20
  sigma_ceiling: 5.0
  sigma_min_samples: 10
  # Applied after blending, before the clamp. >1 widens the distribution
  # (humbler probabilities), <1 sharpens it. The single knob that trades
  # conviction against calibration — set it from `score --calibration`.
  sigma_scale: 1.0
  # Resample ticks to this spacing (sec) before estimating vol; 0 = as
  # delivered. PRELIMINARY (one session, five evaluation points, 2026-08-19):
  # sigma off the engine's 4 Hz BRTI stream read ~0.84x the same data at
  # 1 Hz. If real, the estimate tracks our polling rate rather than the
  # price process. The mechanism is NOT understood — a synthetic with three
  # zero returns in four gives 0.99, because the estimator annualizes by
  # observed inter-arrival time and self-corrects. Left at a no-op default;
  # sweep it once the corpus has a few hours of brti_ticks.
  sigma_sample_sec: 0.0

  # SLICE GRID — the (phase × band) boundaries R1 measures and R2 gates on.
  # Previously hard-coded in core/pricer.py, which made the whole R1/R2
  # methodology rest on three unmeasured constants.
  phase_early_sec: 540.0    # >  this -> "early"
  phase_mid_sec: 300.0      # >  this -> "mid"
  phase_prime_sec: 90.0     # >  this -> "prime", else "late"
  band_extreme_cents: 15.0  # <= this from either end -> "extreme"
  band_outer_cents: 30.0    # <= this -> "outer", else "middle"

  # ENGINE CADENCES — were module constants in core/engine.py. scan_interval
  # bounds how fast we can react inside the final minute, where the TWAP
  # lock-in edge lives.
  scan_interval_sec: 1.0
  ob_refresh_interval_sec: 4.0
  settlement_check_interval_sec: 5.0
  brti_hz: 4.0
  venue_staleness_sec: 5.0

logging:
  level: "INFO"
  log_file: "logs/bot.log"
  trade_log_file: "logs/trades.csv"
  max_log_size_mb: 50

# ── Telemetry recorder ───────────────────────────────────────────────────────
# Captures Kalshi WS frames, venue ticks, and one decision row per market
# per scan (with both p_model and p_market — that pairing is what makes
# `./run.sh score` possible). Never places orders.
recording:
  enabled: true
  path: "data/recordings"
  venue_coinbase: true
  venue_kraken: true
  venue_bitstamp: true
  venue_gemini: false
  grid_interval_sec: 1.0
  venue_max_msg_per_sec: 10
  # Raw Kalshi WS frames cost ~0.5 GB/hour (12 GB/day) — they make 24/7
  # recording impossible. Every decision row now carries the top 5 levels of
  # both sides, which is all `sweep` needs to simulate fills, so leave this
  # OFF for unattended running and switch it on only when you want
  # between-scan microstructure detail.
  kalshi_frames: false

database:
  path: "data/btc15.db"
